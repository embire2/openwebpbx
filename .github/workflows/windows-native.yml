name: Windows standalone 1.0.29 qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: Exact complete installer on a clean Windows Server 2025 runner
    runs-on: windows-2025
    timeout-minutes: 95
    # Draft assets are visible only to an account with repository write access.
    # Only the download step receives the short-lived token; installation has no release credentials.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_ID: '453993317'
      RELEASE_ASSET: '776919082'
      RELEASE_SOURCE: '23cf27176e6d7d7bb9adf0aba9df72b2233f29bf'
      RELEASE_SHA256: 'ec0e2c373df36d9370e1dc658b32f30f29c12b6e4a29b7081916dbb8b61b5184'
      RELEASE_SIZE: '643902877'
    steps:
      - name: Check out the isolated credential-free test fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the exact complete installer from its draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'embire2/openwebpbx'
          if($env:GITHUB_REPOSITORY -cne $repo -or $env:GITHUB_REF_NAME -cne 'windows-qa-1.0.29'){throw 'Unexpected qualification dispatch.'}
          $release = gh api "repos/$repo/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if($LASTEXITCODE -or !$release.draft -or $release.tag_name -cne 'windows-v1.0.29' -or $release.target_commitish -cne $env:RELEASE_SOURCE){throw 'The intended exact Windows draft is not available to this runner.'}
          $asset=@($release.assets | Where-Object { $_.id -eq $env:RELEASE_ASSET -and $_.name -ceq 'openwebpbx-1.0.29-windows-x64.zip' })
          if($asset.Count -ne 1 -or $asset[0].size -ne [long]$env:RELEASE_SIZE){throw 'The draft asset does not match its frozen size and identity.'}
          $sandbox=Join-Path $env:RUNNER_TEMP 'openweb-private-qualification'
          $evidence=Join-Path $sandbox 'receipts'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $archive=Join-Path $sandbox 'openwebpbx-1.0.29-windows-x64.zip'
          gh api --header 'Accept: application/octet-stream' "repos/$repo/releases/assets/$env:RELEASE_ASSET" > $archive
          if($LASTEXITCODE -or (Get-Item -LiteralPath $archive).Length -ne [long]$env:RELEASE_SIZE -or (Get-FileHash -LiteralPath $archive).Hash.ToLowerInvariant() -cne $env:RELEASE_SHA256){throw 'Exact Windows ZIP verification failed.'}
          "OWPBX_QA_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "OWPBX_QA_EVIDENCE=$evidence" >> $env:GITHUB_ENV
      - name: Install the exact archive and qualify service startup over trusted local HTTPS
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -NonInteractive -Mta -ExecutionPolicy Bypass -File tests/windows129-qualification/windows-fresh.ps1 -Archive $env:OWPBX_QA_ARCHIVE -Evidence $env:OWPBX_QA_EVIDENCE -SHA256 $env:RELEASE_SHA256
          if($LASTEXITCODE){throw 'The clean Windows installer or its verification did not pass.'}
          $proof=Get-Content -LiteralPath "$env:OWPBX_QA_EVIDENCE/fresh-install.safe.json" -Raw | ConvertFrom-Json
          if($proof.phase -cne 'passed' -or $proof.archive_sha256 -cne $env:RELEASE_SHA256){throw 'The actual standalone install receipt is unavailable.'}
          $proof | ConvertTo-Json -Depth 5
      - name: Retain only safe clean-install evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openwebpbx-windows-1.0.29-clean-receipt
          path: ${{ runner.temp }}/openweb-private-qualification/receipts/*.safe.json
          if-no-files-found: warn
          retention-days: 14
