name: Windows pinned native engine

on:
  workflow_dispatch:
    inputs:
      use_msi_pthread:
        description: 'Use the exact MSI pthread runtime and matching pinned source'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      USE_MSI_PTHREAD: '${{ inputs.use_msi_pthread }}'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out the dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare x64 native tools
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'The hosted runner has no native C++ toolchain.' }
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $settings = & cmd.exe /d /s /c ('"' + $devcmd + '" -arch=x64 -host_arch=x64 >nul && set')
          if ($LASTEXITCODE) { throw 'The x64 native developer environment failed.' }
          foreach ($line in $settings) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCToolsVersion|WindowsSdkDir|WindowsSDKVersion|VSINSTALLDIR)=(.*)$') {
              $name = $Matches[1]; $value = $Matches[2]
              [Environment]::SetEnvironmentVariable($name, $value, 'Process')
              "$name=$value" >> $env:GITHUB_ENV
            }
          }
          foreach ($tool in 'cl.exe', 'lib.exe', 'MSBuild.exe', 'dumpbin.exe', 'cmake.exe', 'python.exe', 'git.exe') {
            if (!(Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Missing native build tool: $tool" }
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $work = Join-Path $env:RUNNER_TEMP 'openwebpbx-engine'
          New-Item -ItemType Directory $work | Out-Null
          "ENGINE_WORK=$work" >> $env:GITHUB_ENV
          $vsVersion = & $vswhere -latest -property installationVersion
          $major = [int]($vsVersion.Split('.')[0])
          if ($major -eq 17) { $generator = 'Visual Studio 17 2022'; $toolset = 'v143' }
          elseif ($major -eq 18) { $generator = 'Visual Studio 18 2026'; $toolset = 'v145' }
          else { throw 'The hosted native toolset has not been reviewed.' }
          "NATIVE_GENERATOR=$generator" >> $env:GITHUB_ENV
          "NATIVE_TOOLSET=$toolset" >> $env:GITHUB_ENV
          [ordered]@{ source_commit=$env:GITHUB_SHA; version=$version; image=$env:ImageVersion; visual_studio=$vsVersion;
            compiler_directory=$env:VCToolsInstallDir; compiler_version=$env:VCToolsVersion; windows_sdk=$env:WindowsSDKVersion;
            run_url="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } |
            ConvertTo-Json | Set-Content "$work/runner-inputs.json" -Encoding utf8
      - name: Retrieve exact upstream sources and pinned dependency inputs
        run: |
          $ErrorActionPreference = 'Stop'
          function Fetch-Source([string]$Name,[string]$Url,[string]$Revision) {
            $repo = Join-Path $env:ENGINE_WORK $Name
            git init --quiet $repo
            git -C $repo remote add origin $Url
            git -C $repo fetch --depth=1 origin $Revision
            if ($LASTEXITCODE -or (git -C $repo rev-parse FETCH_HEAD).Trim() -ne $Revision) { throw 'Pinned upstream source fetch failed.' }
          }
          Fetch-Source 'fs-repository' 'https://github.com/signalwire/freeswitch.git' 'ef32e205295e29f034f1453ad245ba5efb07b94a'
          Fetch-Source 'sofia-repository' 'https://github.com/freeswitch/sofia-sip.git' 'ad36ac8f755308e8b87f98a505e83d4e408e5cc3'
          Fetch-Source 'codec-repository' 'https://github.com/xadhoom/mod_bcg729.git' '4203247dee4719545005ec7ab9ea536fc83df1d8'
          $dependencyArgs=@('packaging/freeswitch/windows-native-dependencies.py','--downloads',"$env:ENGINE_WORK/downloads",'--fetch')
          if ($env:USE_MSI_PTHREAD -eq 'true') { $dependencyArgs+='--use-msi-pthread' }
          python @dependencyArgs
          if ($LASTEXITCODE) { throw 'Native dependency download or hash verification failed.' }
          python packaging/freeswitch/prepare-windows-native.py --freeswitch-repository "$env:ENGINE_WORK/fs-repository" --sofia-repository "$env:ENGINE_WORK/sofia-repository" --codec-repository "$env:ENGINE_WORK/codec-repository" --bcg729-archives "$env:ENGINE_WORK/downloads" --output "$env:ENGINE_WORK/source"
          if ($LASTEXITCODE) { throw 'Pinned native source preparation failed.' }
      - name: Extract the verified MSI core and derive its import library
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = "$env:ENGINE_WORK/downloads/FreeSWITCH-1.11.3-Release-x64.msi"
          $expected = 'f5649e33ad46be2ebdb1d98019bd149c86519f0dca9f47fb881207045203a34d'
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'The source MSI hash differs.' }
          $image = Join-Path $env:ENGINE_WORK 'msi-image'
          python packaging/freeswitch/extract-windows-core.py --msi $msi --output $image --include-startup-probe |
            Tee-Object "$env:ENGINE_WORK/core-extraction.json"
          if ($LASTEXITCODE) { throw 'The verified read-only MSI table/cabinet extraction failed.' }
          $coreRoot = Join-Path $image 'core'
          $core = Join-Path $coreRoot 'FreeSwitch.dll'; $coreHash = (Get-FileHash $core -Algorithm SHA256).Hash.ToLowerInvariant()
          $definition = Join-Path $env:ENGINE_WORK 'FreeSwitch.def'
          python packaging/freeswitch/core-exports.py --dll $core --expected-sha256 $coreHash --output $definition |
            Tee-Object "$env:ENGINE_WORK/core-exports.json"
          if ($LASTEXITCODE) { throw 'The exact x64 core exports could not be inspected.' }
          lib.exe /nologo /machine:X64 ("/def:$definition") ("/out:$env:ENGINE_WORK/FreeSwitch.lib")
          if ($LASTEXITCODE) { throw 'The MSI-derived native import library failed.' }
          $dependencyArgs=@('packaging/freeswitch/windows-native-dependencies.py','--downloads',"$env:ENGINE_WORK/downloads",'--source',"$env:ENGINE_WORK/source",'--core',$core,'--import-library',"$env:ENGINE_WORK/FreeSwitch.lib")
          if ($env:USE_MSI_PTHREAD -eq 'true') {
            $pthread=Join-Path $coreRoot 'pthread.dll'
            $pthreadHash='2d9d70378f13dcc06eed72005e74a12c6f7ba085e5fd31f97be49b7ef87cfdad'
            $pthreadVersion=(Get-Item $pthread).VersionInfo
            if ((Get-FileHash $pthread).Hash.ToLowerInvariant() -ne $pthreadHash -or $pthreadVersion.FileMajorPart -ne 2 -or $pthreadVersion.FileMinorPart -ne 10 -or $pthreadVersion.FileBuildPart -ne 0 -or $pthreadVersion.FilePrivatePart -ne 0) { throw 'The exact MSI pthread2.10 runtime did not verify.' }
            python packaging/freeswitch/core-exports.py --dll $pthread --expected-sha256 $pthreadHash --library-name pthread.dll --output "$env:ENGINE_WORK/pthread.def" |
              Tee-Object "$env:ENGINE_WORK/pthread-exports.json"
            if ($LASTEXITCODE) { throw 'Exact MSI pthread exports did not verify.' }
            lib.exe /nologo /machine:X64 ("/def:$env:ENGINE_WORK/pthread.def") ("/out:$env:ENGINE_WORK/pthread-msi.lib")
            if ($LASTEXITCODE) { throw 'The exact MSI pthread import library could not be derived.' }
            $dependencyArgs+=@('--use-msi-pthread','--pthread-import-library',"$env:ENGINE_WORK/pthread-msi.lib")
          }
          python @dependencyArgs
          if ($LASTEXITCODE) { throw 'The locked offline dependency tree failed.' }
          "NATIVE_CORE_ROOT=$coreRoot" >> $env:GITHUB_ENV
          "NATIVE_CORE_SHA256=$coreHash" >> $env:GITHUB_ENV
      - name: Preserve verified public source bundle for local codec compilation
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:ENGINE_WORK/source"
          $manifest = (Get-FileHash "$source/source-manifest.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $aprHash = (Get-FileHash "$env:NATIVE_CORE_ROOT/libapr.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $bundleArgs=@('packaging/freeswitch/bundle-windows-native.py','--source',$source,'--source-manifest-sha256',$manifest,'--core-export-helper','packaging/freeswitch/core-exports.py','--core-sha256',$env:NATIVE_CORE_SHA256,'--apr-sha256',$aprHash,'--output',"$env:ENGINE_WORK/codec-source")
          if ($env:USE_MSI_PTHREAD -eq 'true') {
            $lock=(Get-FileHash "$source/dependency-lock.json").Hash.ToLowerInvariant()
            $bundleArgs+=@('--registrar-dependency-lock',"$source/dependency-lock.json",'--registrar-dependency-lock-sha256',$lock,'--pthread-source-archive',"$env:ENGINE_WORK/downloads/pthreads4w-code-v2.10.0-rc.zip",'--pthread-definition',"$env:ENGINE_WORK/pthread.def")
          }
          python @bundleArgs
          if ($LASTEXITCODE) { throw 'The public prepared source bundle did not verify.' }
      - name: Build patched registrar
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:ENGINE_WORK/source"
          $manifest = (Get-FileHash "$source/source-manifest.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $lock = (Get-FileHash "$source/dependency-lock.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          & packaging/freeswitch/Build-WindowsNative.ps1 -SourceRoot $source -SourceManifestSha256 $manifest -DependencyLock "$source/dependency-lock.json" -DependencyLockSha256 $lock -EngineRoot $env:NATIVE_CORE_ROOT -ExpectedCoreSha256 $env:NATIVE_CORE_SHA256 -BuildRoot "$env:ENGINE_WORK/build" -OutputRoot "$env:ENGINE_WORK/engine" -CodecOutputRoot "$env:ENGINE_WORK/local-codec" -PlatformToolset $env:NATIVE_TOOLSET -WindowsSdkVersion $env:WindowsSDKVersion.TrimEnd('\') -CMakeGenerator $env:NATIVE_GENERATOR -SkipMsvcCodec -UseMsiPthread:($env:USE_MSI_PTHREAD -eq 'true') *>&1 |
            Tee-Object "$env:ENGINE_WORK/native-build.log"
          if (!$?) { throw 'The pinned native DLL build failed.' }
          $release = Get-Content "$env:ENGINE_WORK/engine/native-manifest.json" -Raw | ConvertFrom-Json
          if ($release.files.'mod/mod_bcg729.dll' -or (Test-Path "$env:ENGINE_WORK/engine/libbcg729.dll")) { throw 'A local-only codec was mixed into the redistributable engine.' }
          "Patched Windows registrar built from the pinned source. Portable codec callbacks/heap proof are checked by the next step. Native SIP/RTP and rollback qualification remain pending." >> $env:GITHUB_STEP_SUMMARY
      - name: Require actual native phone listener and clean shutdown
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content "$env:ENGINE_WORK/engine/native-manifest.json" -Raw | ConvertFrom-Json
          & tests/windows-registrar-startup.ps1 -EngineRoot $env:NATIVE_CORE_ROOT -Registrar "$env:ENGINE_WORK/engine/mod/mod_sofia.dll" -RegistrarSha256 $release.files.'mod/mod_sofia.dll' -Report "$env:ENGINE_WORK/registrar-startup.json" -DisposableHostedRunner
          if (!$?) { throw 'The actual native phone listener did not qualify.' }
      - name: Require actual canonical identity registration limits
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content "$env:ENGINE_WORK/engine/native-manifest.json" -Raw | ConvertFrom-Json
          $python = (Get-Command python.exe -CommandType Application).Source
          $pythonHash = (Get-FileHash -LiteralPath $python -Algorithm SHA256).Hash.ToLowerInvariant()
          & tests/windows-registrar-limits.ps1 -EngineRoot $env:NATIVE_CORE_ROOT -CandidateModule "$env:ENGINE_WORK/engine/mod/mod_sofia.dll" -ExpectedCandidateSha256 $release.files.'mod/mod_sofia.dll' -Python $python -ExpectedPythonSha256 $pythonHash -Report "$env:ENGINE_WORK/registrar-limits.json" -DisposableHostedRunner
          if (!$?) { throw 'Actual native canonical registration quotas did not qualify.' }
      - name: Prove the portable local-only source codec
        if: ${{ !cancelled() && env.NATIVE_CORE_ROOT != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:ENGINE_WORK/source-codec"
          python packaging/freeswitch/prepare-windows-native.py --freeswitch-repository "$env:ENGINE_WORK/fs-repository" --sofia-repository "$env:ENGINE_WORK/sofia-repository" --codec-repository "$env:ENGINE_WORK/codec-repository" --bcg729-archives "$env:ENGINE_WORK/downloads" --output $source
          if ($LASTEXITCODE) { throw 'Fresh portable codec source preparation failed.' }
          $manifest = (Get-FileHash "$source/source-manifest.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $apr = Join-Path $env:NATIVE_CORE_ROOT 'libapr.dll'
          if (!(Test-Path $apr -PathType Leaf)) { throw 'The verified MSI APR runtime is missing.' }
          $aprHash = (Get-FileHash $apr -Algorithm SHA256).Hash.ToLowerInvariant()
          python packaging/codecs/bcg729/build-windows-local.py --source $source --source-manifest-sha256 $manifest --engine-root $env:NATIVE_CORE_ROOT --core-sha256 $env:NATIVE_CORE_SHA256 --apr-sha256 $aprHash --core-export-helper packaging/freeswitch/core-exports.py --build "$env:ENGINE_WORK/portable-build" --output "$env:ENGINE_WORK/portable-codec" --compiler-cache "$env:ENGINE_WORK/compiler-cache" 2>&1 |
            Tee-Object "$env:ENGINE_WORK/portable-codec-build.log"
          if ($LASTEXITCODE) { throw 'Portable source codec, DATA imports or heap ownership proof failed.' }
          Copy-Item "$env:ENGINE_WORK/portable-codec/local-codec-manifest.json" "$env:ENGINE_WORK/portable-codec-evidence.json"
          "Pinned portable C compiler completed real codec callbacks, MSI DATA imports and1000 owning-heap cycles. Combined codec DLLs remain local-only and are not uploaded. Native SIP/RTP qualification is still separate." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload registrar build and credential-free evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwebpbx-windows-engine-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/openwebpbx-engine/engine/
            ${{ runner.temp }}/openwebpbx-engine/runner-inputs.json
            ${{ runner.temp }}/openwebpbx-engine/core-extraction.json
            ${{ runner.temp }}/openwebpbx-engine/core-exports.json
            ${{ runner.temp }}/openwebpbx-engine/registrar-startup.json
            ${{ runner.temp }}/openwebpbx-engine/registrar-limits.json
            ${{ runner.temp }}/openwebpbx-engine/codec-source/
            ${{ runner.temp }}/openwebpbx-engine/codec-callback-evidence.json
            ${{ runner.temp }}/openwebpbx-engine/portable-codec-evidence.json
            ${{ runner.temp }}/openwebpbx-engine/portable-codec-build.log
            ${{ runner.temp }}/openwebpbx-engine/native-build.log
            ${{ runner.temp }}/openwebpbx-engine/build/*.imports.txt
            ${{ runner.temp }}/openwebpbx-engine/source/source-manifest.json
            ${{ runner.temp }}/openwebpbx-engine/source/dependency-lock.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 6
      - name: Retain private experimental symbols and thread proof
        if: ${{ always() && inputs.use_msi_pthread }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwebpbx-windows-pthread-experiment-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/openwebpbx-engine/build/registrar-output/mod_sofia.pdb
            ${{ runner.temp }}/openwebpbx-engine/build/pthread-check.out
            ${{ runner.temp }}/openwebpbx-engine/build/pthread-check.err
            ${{ runner.temp }}/openwebpbx-engine/pthread-exports.json
          if-no-files-found: warn
          retention-days: 7
