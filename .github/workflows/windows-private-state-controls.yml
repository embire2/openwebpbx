name: Windows isolated original Hash and sharing controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash-sharing:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve reviewed source bytes
        run: git config --global core.autocrlf false
      - name: Check out the exact isolated component source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test original hashing with actual owned read and exclusive handles
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_REPOSITORY -cne 'embire2/openwebpbx'){throw 'Only the owned hosted component job is allowed.'}
          $probeBundle=Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/windows-hash-sharing'
          $manifest=Join-Path $probeBundle 'MANIFEST.json'
          if((Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -cne '488600318b2902a0a76c728269f98237c521b70dd2d5927ba91e9caed7d4752f'){throw 'The reviewed component manifest changed.'}
          $pins=Get-Content -LiteralPath $manifest -Raw|ConvertFrom-Json
          foreach($entry in $pins.PSObject.Properties){if((Get-FileHash -LiteralPath (Join-Path $probeBundle $entry.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.Value){throw 'A reviewed component input changed.'}}
          $python=(Get-Command python.exe -CommandType Application -ErrorAction Stop).Source
          $pwsh=(Get-Process -Id $PID).Path
          $pyHash=(Get-FileHash -LiteralPath $python -Algorithm SHA256).Hash.ToLowerInvariant()
          $psHash=(Get-FileHash -LiteralPath $pwsh -Algorithm SHA256).Hash.ToLowerInvariant()
          & $python -I -B -S (Join-Path $probeBundle 'probe.py') --execute --pwsh $pwsh --pwsh-sha256 $psHash --python-sha256 $pyHash | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'hash-sharing-qualification.json')
          if($LASTEXITCODE){throw 'The original Hash/native sharing component refused; closed observations are retained.'}
      - name: Preserve only closed fictional component facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwebpbx-hash-sharing-${{ github.run_id }}
          path: ${{ runner.temp }}/hash-sharing-qualification.json
          if-no-files-found: warn
          retention-days: 14
