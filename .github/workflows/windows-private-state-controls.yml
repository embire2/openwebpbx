name: Windows isolated stock PowerShell component
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-component:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve repository bytes
        run: git config --global core.autocrlf false
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select readable x64 Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: 'x64'
          check-latest: false
          update-environment: false
      - name: Observe direct and original owned Job stock commands
        env:
          OPENWEB_STOCK_COMPONENT: '1'
          OPENWEB_WINDOWS_NATIVE_TEST: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          OPENWEB_STOCK_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference='Stop'
          $python=$env:OPENWEB_STOCK_PYTHON
          if(![IO.Path]::IsPathFullyQualified($python) -or ![IO.File]::Exists($python)){throw 'The pinned readable interpreter is required.'}
          & $python -I -B tests/windows_stock_component.py --execute --pwsh (Get-Process -Id $PID).Path
          if($LASTEXITCODE){throw 'The isolated component did not complete; this never qualifies PBX or media.'}
      - name: Preserve only bounded public stock observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwebpbx-windows-stock-component-${{ github.run_id }}
          path: ${{ runner.temp }}/stock-module-component.json
          if-no-files-found: warn
          retention-days: 14
