name: Windows Free Phone client
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed40-character client-branch commit
        required: true
        type: string
      build_mode:
        description: Inventory probe, native client build, or source candidate collection
        type: choice
        options: [probe, build, sources]
        default: probe
permissions:
  contents: read
concurrency:
  group: windows-free-phone-${{ inputs.build_mode == 'sources' && 'sources' || 'client' }}
  cancel-in-progress: false
jobs:
  client:
    if: inputs.build_mode != 'sources'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_XMLDOC_MODE: skip
      PHONE_BUILD_MODE: ${{ inputs.build_mode }}
      PHONE_SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Validate reviewed client source
        run: |
          if($env:GITHUB_REPOSITORY -cne 'embire2/openwebpbx' -or $env:PHONE_SOURCE_REF -cnotmatch '^[a-f0-9]{40}$' -or $env:PHONE_BUILD_MODE -cnotin @('probe','build')){throw 'An exact reviewed client source and supported mode are required.'}
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify actual source
        run: |
          if((git rev-parse HEAD).Trim() -cne $env:PHONE_SOURCE_REF){throw 'Client source differs.'}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
      - name: Probe native client toolchain and official SDK
        if: inputs.build_mode == 'probe'
        run: |
          & ./clients/windows/tools/Probe-Environment.ps1 -Output "$env:RUNNER_TEMP/windows-phone-probe"
      - name: Build and launch native client
        if: inputs.build_mode == 'build'
        run: |
          & ./clients/windows/tools/Build-Client.ps1 -Output "$env:RUNNER_TEMP/windows-phone-build"
      - name: Preserve native client build evidence
        if: always() && inputs.build_mode == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-free-phone-build-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-phone-build/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded component evidence
        if: always() && inputs.build_mode == 'probe'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-free-phone-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-phone-probe/
          if-no-files-found: error
          retention-days: 14
  sources:
    if: inputs.build_mode == 'sources'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PHONE_SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Validate reviewed source candidate request
        run: |
          if($env:GITHUB_REPOSITORY -cne 'embire2/openwebpbx' -or $env:PHONE_SOURCE_REF -cnotmatch '^[a-f0-9]{40}$'){throw 'An exact reviewed client source is required.'}
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify actual source
        run: |
          if((git rev-parse HEAD).Trim() -cne $env:PHONE_SOURCE_REF){throw 'Client source differs.'}
      - name: Collect pinned source candidate
        run: |
          & ./clients/windows/tests/source/SourceDiagnostics.Checks.ps1
          & ./clients/windows/tests/source/SourceCi.Checks.ps1
          & ./clients/windows/tools/Collect-Source-Ci.ps1 -Output "$env:RUNNER_TEMP/windows-phone-source"
      - name: Preserve closed source collection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-free-phone-source-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-phone-source/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve source candidate for review
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-free-phone-source-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-phone-source/packet/
          if-no-files-found: error
          retention-days: 14
