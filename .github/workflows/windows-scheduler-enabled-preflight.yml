name: Controlled Windows Scheduler default Enabled export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Admit exact fresh native component
        run: |
          if($env:GITHUB_REPOSITORY-cne 'embire2/openwebpbx'-or $env:GITHUB_REF-cne 'refs/heads/qualification/windows121-scheduler-enabled-20261026'-or $env:GITHUB_RUN_ATTEMPT-cne '1'){throw 'Exact fresh request required.'}
          if((Get-CimInstance Win32_OperatingSystem).Caption-notmatch 'Windows Server 2025'){throw 'Actual Server2025 required.'}
          foreach($path in 'C:\OpenWebPBX',(Join-Path $env:ProgramData 'OpenWebPBX'),'C:\Program Files\FreeSWITCH'){if(Test-Path -LiteralPath $path){throw 'Fresh host required.'}}
          if(@(Get-Service -Name 'OpenWebPBX*','FreeSWITCH' -ErrorAction SilentlyContinue).Count){throw 'No installed PBX may be tested.'}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
          update-environment: false
      - name: Observe owned never-started Scheduler default and cleanup
        timeout-minutes: 4
        env:
          OWNED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          if((& git rev-parse HEAD).Trim()-cne $env:GITHUB_SHA-or $LASTEXITCODE-or (& git status --porcelain)){throw 'Exact clean source required.'}
          & $env:OWNED_PYTHON -I -B tests/windows_scheduler_enabled_preflight.py --evidence (Join-Path $env:RUNNER_TEMP 'scheduler-enabled-preflight-evidence')
          if($LASTEXITCODE){throw 'Scheduler component failed; no PBX qualification implied.'}
      - name: Preserve only closed Scheduler component receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-scheduler-enabled-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/scheduler-enabled-preflight-evidence/*.safe.json
          if-no-files-found: error
          retention-days: 14
