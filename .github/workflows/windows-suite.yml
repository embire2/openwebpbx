name: Windows disposable full-suite qualification

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful Windows native build run from this repository
        required: true
        type: string
      engine_run_id:
        description: Successful pinned Windows engine build run from this repository
        required: true
        type: string
      replay_suite_run_id:
        description: Optional original full-suite run; reuses its untouched ZIP only when Windows runtime sources are identical
        required: false
        default: ''
        type: string
      replay_terminal_producers:
        description: Explicitly accept exact completed producer jobs when the original run-level status is stale; never qualifies the original PBX
        required: false
        default: false
        type: boolean
      native_diagnostics_only:
        description: Diagnostic only; run native calling/media without backup or upgrade qualification
        required: false
        default: false
        type: boolean
      skip_phone_health_for_native_diagnostics:
        description: Explicit fresh-factory calling diagnostics only; skip Health qualification from the outset; never release eligible
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-suite-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  music:
    if: ${{ inputs.replay_suite_run_id == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare all four canonical music rates
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y sox
          python3 packaging/windows/build-hold-music.py --source-root resources/music-on-hold --output "$RUNNER_TEMP/openwebpbx-suite-inputs/music"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          binary=pathlib.Path(shutil.which('sox')).resolve()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'openwebpbx-suite-inputs'/'music'
          facts={'source_commit':os.environ['GITHUB_SHA'],'sox_version':subprocess.check_output([str(binary),'--version'],text=True).strip(),'sox_binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'source_sha256':hashlib.sha256(pathlib.Path('resources/music-on-hold/lofi-beat-loop-schmoop.wav').read_bytes()).hexdigest()}
          (root/'build-provenance.json').write_text(json.dumps(facts,indent=2)+'\n')
          PY
      - name: Stage the immutable public Nathaniel system prompts
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/embire2/openwebpbx/releases/download/v1.0.16/openwebpbx-1.0.16-debian13-amd64.tar.gz' --output "$RUNNER_TEMP/public-debian16.tar.gz"
          python3 packaging/windows/stage-public-voices.py --archive "$RUNNER_TEMP/public-debian16.tar.gz" --output "$RUNNER_TEMP/openwebpbx-suite-inputs/voices/1.0.1" > "$RUNNER_TEMP/openwebpbx-suite-inputs/voice-provenance.json"
          rm "$RUNNER_TEMP/public-debian16.tar.gz"
      - name: Store only canonical prepared audio and build provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwebpbx-windows-suite-music-${{ github.run_id }}
          path: ${{ runner.temp }}/openwebpbx-suite-inputs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  suite:
    needs: music
    if: ${{ always() && !cancelled() && (needs.music.result == 'success' || (needs.music.result == 'skipped' && inputs.replay_suite_run_id != '')) }}
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify build inputs and qualify the isolated server
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
          REPLAY_SUITE_RUN_ID: ${{ inputs.replay_suite_run_id }}
          REPLAY_TERMINAL_PRODUCERS: ${{ inputs.replay_terminal_producers }}
          NATIVE_DIAGNOSTICS_ONLY: ${{ inputs.native_diagnostics_only }}
          SKIP_PHONE_HEALTH_FOR_NATIVE_DIAGNOSTICS: ${{ inputs.skip_phone_health_for_native_diagnostics }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:NATIVE_RUN_ID -notmatch '^[0-9]+$' -or $env:ENGINE_RUN_ID -notmatch '^[0-9]+$'){throw 'Both inputs must be numeric run IDs.'}
          if($env:REPLAY_SUITE_RUN_ID -and $env:REPLAY_SUITE_RUN_ID -cnotmatch '^[1-9][0-9]{0,19}$'){throw 'The optional replay run must be numeric.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/windows_task_security.ps1
          if($LASTEXITCODE){throw 'Native task security controls failed before server qualification.'}
          $producerOptions=@{}
          if($env:NATIVE_DIAGNOSTICS_ONLY -ceq 'true'){$producerOptions.NativeDiagnosticsOnly=$true}
          if($env:SKIP_PHONE_HEALTH_FOR_NATIVE_DIAGNOSTICS -ceq 'true'){$producerOptions.SkipPhoneHealthForNativeDiagnostics=$true}
          if($env:REPLAY_TERMINAL_PRODUCERS -ceq 'true'){$producerOptions.ReplayTerminalProducers=$true}
          & tests/windows-suite.ps1 -NativeRunId $env:NATIVE_RUN_ID -EngineRunId $env:ENGINE_RUN_ID -ReplaySuiteRunId $env:REPLAY_SUITE_RUN_ID @producerOptions -DisposableHostedRunner
          if(!$?){throw 'Windows qualification did not finish.'}
      - name: Store only credential-free acceptance facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwebpbx-windows-suite-facts-${{ github.run_id }}
          path: ${{ runner.temp }}/openwebpbx-suite-public/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
      - name: Preserve only the original verified candidate package and checksum
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwebpbx-windows-suite-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/openwebpbx-suite-candidate/openwebpbx-*-windows-x64.zip
            ${{ runner.temp }}/openwebpbx-suite-candidate/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
