name: Windows upgrade compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - packaging/windows/PhpRuntime.Common.ps1
      - packaging/windows/Upgrade-OpenWebPBX.ps1
      - packaging/windows/CallRecords.Common.ps1
      - tests/windows_upgrade_delegation.ps1
      - tests/windows_delegated_host.ps1
      - tests/windows_legacy_unsealed_recovery.ps1
      - .github/workflows/windows-upgrade-compatibility.yml
  pull_request:
    paths:
      - packaging/windows/PhpRuntime.Common.ps1
      - packaging/windows/Upgrade-OpenWebPBX.ps1
      - packaging/windows/CallRecords.Common.ps1
      - tests/windows_upgrade_delegation.ps1
      - tests/windows_delegated_host.ps1
      - tests/windows_legacy_unsealed_recovery.ps1
      - .github/workflows/windows-upgrade-compatibility.yml

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Keep exact repository source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Obtain and pin the retained original Windows23 caller
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path compatibility-results | Out-Null
          $original=Join-Path $env:RUNNER_TEMP 'openweb-original23-upgrade.ps1'
          Invoke-WebRequest -UseBasicParsing 'https://raw.githubusercontent.com/embire2/openwebpbx/e1aaad63f99ac3b11714d9d0cd3f2a085778688f/packaging/windows/Upgrade-OpenWebPBX.ps1' -OutFile $original
          if((Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash.ToLowerInvariant() -cne '527e17a9349fd5e9f3b1d048fd2f4526495e2cdc5e28f836fe79d8fd17ff1eec'){throw 'Original caller bytes differ.'}
          "ORIGINAL23_HELPER=$original" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify original-caller delegation on Windows PowerShell 5.1
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Mta -ExecutionPolicy Bypass -File tests/windows_upgrade_delegation.ps1 -Original23Helper $env:ORIGINAL23_HELPER
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Reproduce dot-source continuation and verify terminal handoff
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Mta -ExecutionPolicy Bypass -File tests/windows_delegated_host.ps1 -SourceRoot $env:GITHUB_WORKSPACE -Receipt compatibility-results/delegated-host.safe.json
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Verify strict unsealed legacy recovery admission
        shell: pwsh
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Mta -ExecutionPolicy Bypass -File tests/windows_legacy_unsealed_recovery.ps1 -SourceRoot $env:GITHUB_WORKSPACE -Receipt compatibility-results/unsealed-recovery.safe.json
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Retain safe compatibility receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-upgrade-compatibility
          path: compatibility-results/*.safe.json
          if-no-files-found: warn
