# Include only inside the dedicated domains.openwebpbx.com HTTPS server.
# TLS certificate and central-only configuration are provisioned by its custodian.
location / {
    proxy_pass http://127.0.0.1:5095;
    proxy_set_header Host domains.openwebpbx.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    client_max_body_size 4k;
}
