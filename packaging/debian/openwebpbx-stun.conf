# OpenWeb PBX managed STUN-only configuration, revision 1
listening-port=3478
@LISTENING_IPS@
stun-only
no-stun-backward-compatibility=0
no-rfc5780
no-tcp
no-tls
no-dtls
no-cli
no-software-attribute
relay-threads=0
pidfile=/run/openwebpbx-stun/turnserver.pid
userdb=/run/openwebpbx-stun/turn.sqlite
simple-log
log-file=/dev/null
no-stdout-log
