# Include inside the PBX HTTPS server. Preserve WSS on the encrypted private hop.
location = /meet-sip/ {
    proxy_pass https://127.0.0.1:7444;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/openwebpbx/meet-ca.pem;
    proxy_ssl_name openweb-meet.internal;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
