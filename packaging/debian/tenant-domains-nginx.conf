server {
 listen 443 ssl; listen [::]:443 ssl; server_name @HOST@;
 ssl_certificate "@CERT@"; ssl_certificate_key "@KEY@";
 root /var/www/fusionpbx; index index.php;
 client_max_body_size 2060M;
 add_header X-Content-Type-Options nosniff always;
 include /etc/nginx/snippets/openweb-meet.conf;
 location = / {
  # Ordinary administrator authentication returns through /?path=... .
  # Keep that existing login route distinct from the personal portal root.
  if ($arg_path != "") { return 302 /login.php$is_args$args; }
  return 302 /app/pbx_mobile/user.php;
 }
 location = /admin { return 302 /tenantadmin/; }
 location = /admin/ { return 302 /tenantadmin/; }
 location ~ /\. { deny all; }
 location ~* \.(sql|lua|conf|key|zip)$ { deny all; }
 location ~ ^/(tests|packaging|platform)/ { deny all; }
 location / { try_files $uri $uri/ =404; }
 location ~ \.php$ {
  try_files $uri =404;
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_pass unix:/run/php/php8.4-fpm.sock;
  fastcgi_read_timeout 900s;
 }
}
