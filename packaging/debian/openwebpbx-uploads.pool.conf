; OpenWeb PBX isolated encrypted-upload workers v1
[openwebpbx-uploads]
user = www-data
group = www-data
listen = /run/php/openwebpbx-uploads.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 100
request_terminate_timeout = 1800s
security.limit_extensions = .php
php_admin_flag[enable_post_data_reading] = off
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 1800
php_admin_value[max_input_time] = 1800
