# Synthetic stock Debian 1.0.22 site layout; no deployed hostname or key material.
server {
 listen 80; server_name stock22.example.invalid;
 include /etc/nginx/snippets/openweb-tenant-domains-proof.conf;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl; server_name stock22.example.invalid;
 include /etc/nginx/snippets/openweb-tenant-domains-proof.conf;
 ssl_certificate /etc/letsencrypt/live/stock22.example.invalid/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/stock22.example.invalid/privkey.pem;
 root /var/www/fusionpbx; index index.php;
 client_max_body_size 2060M;
 add_header X-Content-Type-Options nosniff always;
 include /etc/nginx/snippets/openweb-meet.conf;
 # The API front controller preserves the original request path and JSON body.
 location ^~ /api/v1/ {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /var/www/fusionpbx/api/v1/index.php;
  fastcgi_param SCRIPT_NAME /api/v1/index.php;
  fastcgi_pass unix:/run/php/php8.4-fpm.sock;
  fastcgi_read_timeout 90s;
  client_max_body_size 64k;
 }
 location ~ /\. { deny all; }
 location ~* \.(sql|lua|conf|key|zip)$ { deny all; }
 location ~ ^/(tests|packaging|platform)/ { deny all; }
 location / { try_files $uri $uri/ =404; }
 location ~ \.php$ {
  try_files $uri =404;
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_pass unix:/run/php/php8.4-fpm.sock;
  fastcgi_read_timeout 900s;
 }
}
